[build-system]
requires = [ "setuptools>=77.0.0" ]
build-backend = "setuptools.build_meta"

[project]
name = "starfun3d"
version = "0.0.0.dev0"
description = "StarDist-based segmentation. In 3D."
license = "Unlicense"
authors = [{name = "Curtis Rueden"}]
readme = "README.md"
keywords = ["python", "segmentation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
]

requires-python = ">=3.10"
dependencies = [
]

[dependency-groups]
dev = [
    "build",
    "pytest",
    "ruff",
    "validate-pyproject[all]",
]

[project.urls]
homepage = "https://github.com/ctrueden/starfun3d"
documentation = "https://github.com/ctrueden/starfun3d/blob/main/README.md"
source = "https://github.com/ctrueden/starfun3d"
#download = "https://pypi.org/project/starfun3d"
tracker = "https://github.com/ctrueden/starfun3d"

[tool.setuptools]
platforms = ["any"]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 88
src = ["src", "tests"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend-exclude = ["bin", "build", "dist"]

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
"__init__.py" = ["E402", "F401"]

[tool.pytest.ini_options]
addopts = "-s -p no:faulthandler"
