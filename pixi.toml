[workspace]
name = "starfun3d"
version = "0.0.0.dev0"
description = "StarDist-based segmentation. In 3D."
authors = ["Curtis Rueden"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = "<2"
scipy = "*"
# Install most packages via pip for better cross-platform support
pip = "*"

[pypi-dependencies]
stardist = "*"
tensorflow = "*"
csbdeep = "*"
ndv = {extras = ["qt"]}
pygfx = "<0.13.0"

[feature.cuda.target.linux-64.dependencies]
# Add CUDA support for GPU acceleration (Linux only)
cuda-nvcc = "*"
cudnn = "*"

[feature.cuda.target.linux-64.pypi-dependencies]
# Use CUDA-enabled TensorFlow on Linux
tensorflow = {version = "*", extras = ["and-cuda"]}

[feature.dev.dependencies]
pytest = "*"
ruff = "*"

[feature.dev.pypi-dependencies]
build = "*"
validate-pyproject = {extras = ["all"]}

[tasks]
# Main application
start = "python src/main.py"

# Development tasks
lint = "ruff check --fix && ruff format"
test = "pytest -v -p no:faulthandler tests"
validate = "validate-pyproject pyproject.toml"
dist = "python -m build"

# Combined tasks
check = {depends-on = ["validate", "lint"]}

[environments]
default = {solve-group = "default"}
cuda = {features = ["cuda"], solve-group = "default"}
dev = {features = ["dev"], solve-group = "default"}
cuda-dev = {features = ["cuda", "dev"], solve-group = "default"}
